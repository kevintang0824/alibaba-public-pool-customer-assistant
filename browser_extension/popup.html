<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>公海客户开发助手</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: "Microsoft YaHei UI", Arial, sans-serif;
        color: #202124;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      p {
        margin: 8px 0;
        color: #5f6368;
        font-size: 13px;
        line-height: 1.55;
      }
      button {
        width: 100%;
        height: 36px;
        margin-top: 12px;
        border: 0;
        border-radius: 8px;

        background: #ff6a00;
        font-weight: 700;
        cursor: pointer;
      }

  <body>
    <h1>阿里公海客户开发助手</h1>

    <p>设置和任务数据仅保存在当前浏览器中。</p>
    <button id="openPanel">显示网页面板</button>
    <script src="popup.js"></script>
